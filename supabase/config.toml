# ── verify_jwt: this file is the SOURCE OF TRUTH ───────────────────────────────
# Every deployed function is declared below, including the ones whose value is
# the `true` default. That is deliberate. The CLI applies `verify_jwt = true` to
# any function it does not find here, so an undeclared function is not "left
# alone" on deploy — it is silently flipped to true. Before 2026-08-07 only two
# entries existed, which meant a routine `supabase functions deploy` of
# stripe-webhook, revenuecat-webhook or plaid-create-link-token would have
# started rejecting callers that cannot mint a Supabase JWT.
#
# The MCP/dashboard deploy path ignores this file entirely and defaults to true,
# so deploys through it must still pass verify_jwt explicitly. Values here were
# read off the LIVE function list on 2026-08-07; re-read it before trusting them.

# ── verify_jwt = false: caller cannot mint a Supabase JWT ──────────────────────

# Called by pg_cron via pg_net. Authenticates the caller itself with the
# x-webhook-secret header and returns 401 without it.
[functions.plaid-sync-all]
verify_jwt = false

# Called by pg_cron via pg_net, which cannot mint a Supabase JWT. The function
# authenticates the caller itself with the x-webhook-secret header and returns 401
# without it. This entry exists so a CLI deploy cannot silently re-enable JWT
# verification and break the cron — deploys through the MCP/dashboard have to pass
# verify_jwt: false explicitly, and have done so on every version to date.
[functions.reddit-scout]
verify_jwt = false

# Stripe calls this server-to-server. Authenticity comes from the Stripe
# signature check on the raw body, not from a Supabase JWT.
[functions.stripe-webhook]
verify_jwt = false

# RevenueCat calls this server-to-server and authenticates with its own
# Authorization header value, which is not a Supabase JWT.
[functions.revenuecat-webhook]
verify_jwt = false

# Reached during the Plaid link flow before a session is necessarily
# established; it does its own caller checks.
[functions.plaid-create-link-token]
verify_jwt = false

# Serves the shared build page to people who are not signed in at all. There is
# nothing to mint a JWT with: the caller is a stranger with a link. Authorization
# is the exact share-token match the function performs itself with the service
# role, and the token never appears in a response.
# ⚠️ ADDED 2026-08-19 after this entry's ABSENCE was found the hard way. The
# function had been live and anonymous since June, undeclared here, so the very
# `supabase functions deploy` that would have shipped the maintenance log to it
# would also have flipped it to verify_jwt = true and made every shared build
# link 401 for the people it exists for.
[functions.public-build]
verify_jwt = false

# Turnstile verification happens BEFORE sign-up, so by definition the caller has
# no account and no JWT.
[functions.verify-turnstile]
verify_jwt = false

# Reached on return from Stripe Checkout, where the session may not be
# re-established yet. Validates the checkout session with Stripe itself.
[functions.verify-checkout]
verify_jwt = false

# Promo redemption from a link, before the recipient necessarily has a session.
[functions.grant-promo-premium]
verify_jwt = false

# Scheduled jobs driven by pg_cron via pg_net, which cannot mint a Supabase JWT.
[functions.unverified-nudge]
verify_jwt = false

[functions.newsletter-digest]
verify_jwt = false

[functions.publish-slot]
verify_jwt = false

# ── verify_jwt = true: caller is the authenticated app ─────────────────────────

# Serves _shared/sync-handler.ts, which requires a user Bearer token and calls
# auth.getUser() itself. The platform check is belt-and-braces.
[functions.plaid-sync]
verify_jwt = true

# Same handler as plaid-sync, under the provider-agnostic name, so it carries
# the same setting.
[functions.financial-sync]
verify_jwt = true

[functions.plaid-exchange-token]
verify_jwt = true

# Plaid Hosted Link redirect target. Validates the Bearer token with
# auth.getUser() before doing anything.
[functions.plaid-hosted-link-result]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# The Stripe billing surfaces. Every one is reached from inside the signed-in
# app, so the platform check is the outer guard and the function's own
# auth.getUser() is the inner one.
[functions.create-checkout]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true

[functions.create-setup-intent]
verify_jwt = true

[functions.manage-subscription]
verify_jwt = true

[functions.update-payment-method]
verify_jwt = true

[functions.sync-stripe-email]
verify_jwt = true

[functions.update-password]
verify_jwt = true

[functions.ai-advisor]
verify_jwt = true

# Partner linking (invite / accept / status). Both halves of the consent are
# written from a verified JWT — the inviter's on invite, the invitee's on
# accept — so there is no anonymous path into this function by design, and the
# platform check is the outer guard for the auth.getUser() the function does
# itself. The invite email carries a code, NOT a bearer link: clicking it lands
# in the signed-in app, which then calls this function with its own JWT.
[functions.partner-link]
verify_jwt = true

# Friend links (invite / accept / status), docs/friends-leaderboard-plan.md §2.
# Same reasoning as partner-link above: both halves of the consent are written
# from a verified JWT, so there is no anonymous path into this function and the
# platform check is the outer guard for the auth.getUser() it does itself. The
# invite email carries a code, NOT a bearer link. Declared here even though the
# value is the default, because an UNDECLARED function is silently flipped to
# true on deploy rather than left alone (see the header).
[functions.friend-link]
verify_jwt = true
