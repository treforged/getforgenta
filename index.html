<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/forgenta-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/forgenta-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/forgenta-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/forgenta-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/forgenta-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/forgenta-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />

    <!-- Primary -->
    <title>Forgenta — Personal Finance, Engineered</title>
    <meta name="description" content="Budget with precision. Eliminate debt. Stack savings. Forgenta is the financial cockpit for people who take their money seriously." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="application-name" content="Forgenta" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forgenta" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getforgenta.com" />
    <meta property="og:title" content="Forgenta — Personal Finance, Engineered" />
    <meta property="og:description" content="Budget with precision. Eliminate debt. Stack savings. Track every goal." />
    <meta property="og:site_name" content="Forgenta" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Forgenta — Personal Finance, Engineered" />
    <meta name="twitter:description" content="Budget with precision. Eliminate debt. Stack savings. Track every goal." />

    <!-- Fonts — non-blocking so WKWebView renders immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <!-- Theme, applied BEFORE first paint.
         WARNING: this has to be inline and synchronous. React mounts after the first paint, so a
         light-mode user whose theme is set from a component watches the dark palette flash on every
         single load. Keep it dependency-free and keep it in <head>: the moment it needs an import
         it is no longer earlier than the paint. Mirrors src/lib/theme.ts; both are small enough
         that duplicating them beats shipping a module to run one line. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('forgenta.theme.v1');
          var choice = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var light = choice === 'light'
            || (choice === 'system' && window.matchMedia
                && window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(light ? 'light' : 'dark');
          root.style.colorScheme = light ? 'light' : 'dark';
        } catch (e) {
          /* Dark is the app's default palette, i.e. what :root already is. Doing nothing is correct. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- BOOT SPLASH (ask 98cbf494, Tre: "same for other loading/cover screens"). Before the bundle
         runs, a web cold load showed an empty page. This is the Forgenta mark at the same 112px as
         LoadingMark, pulsing, as a SIBLING of #root: the boot guard below counts #root's children
         to decide "mounted", so anything placed inside #root would blind it. The guard's observer
         removes this the moment #root gets content, and fail() removes it before the error screen.
         Its two backgrounds are index.css's .dark / .light --background, keyed on the class the head
         script sets before first paint, so light mode does not flash dark. -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:hsl(222 24% 4%)}
      html.light #boot-splash{background:hsl(0 0% 96%)}
      #boot-splash img{width:112px;height:112px;object-fit:contain}
      @media (prefers-reduced-motion:no-preference){#boot-splash img{animation:boot-pulse 1.6s ease-in-out infinite}}
      @keyframes boot-pulse{0%,100%{opacity:1}50%{opacity:.55}}
    </style>
    <div id="boot-splash" role="status" aria-label="Loading Forgenta"><img src="/logo-transparent-384.png" alt="" /></div>
    <!-- BOOT GUARD (2026-09-29, ask 76d3f608). Tre opened the iOS app to a BLACK screen: the app
         loads getforgenta.com, and if the JS never mounts, all that is left is the dark page
         background, which says nothing. This inline, dependency-free script turns that into a
         visible "Couldn't load" screen with a retry, and records the failure in localStorage so
         the next good boot can report it (src/lib/boot-failure.ts). It must stay inline: a guard
         that lives in the bundle cannot report that the bundle failed.
         It fails LOUD in three cases: a <script> or modulepreload fails to load, a lazy route
         chunk fails (main.tsx dispatches 'forgenta:boot-failed'), or #root is still empty after
         BOOT_TIMEOUT_MS. It never hides the app: the screen is a sibling of #root and removes
         itself the moment #root gets content, so a slow network that eventually mounts wins. -->
    <div id="boot-failed" role="alert" style="position:fixed;inset:0;z-index:2147483647;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:#0a0a0a;color:#f5f5f5;font-family:-apple-system,system-ui,sans-serif">
      <p style="margin:0;font-size:18px;font-weight:600">Couldn't load Forgenta</p>
      <p style="margin:0;font-size:14px;color:#bdbdbd;max-width:320px">Your data is safe. This is usually a brief network or update hiccup.</p>
      <button id="boot-retry" type="button" style="min-height:44px;padding:10px 24px;border-radius:9999px;border:1px solid #c9a24a;background:#c9a24a;color:#0a0a0a;font-size:15px;font-weight:600">Tap to retry</button>
    </div>
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 12000;
        var KEY = 'forgenta.bootFailure.v1';
        var shown = false;
        function mounted() { var r = document.getElementById('root'); return !!(r && r.childElementCount > 0); }
        function hideSplash() { var s = document.getElementById('boot-splash'); if (s && s.parentNode) s.parentNode.removeChild(s); }
        function show() { hideSplash(); var el = document.getElementById('boot-failed'); if (el) el.style.display = 'flex'; }
        function record(reason) {
          try { localStorage.setItem(KEY, JSON.stringify({ reason: String(reason).slice(0, 200), at: new Date().toISOString(), path: location.pathname })); } catch (e) { /* storage blocked: the screen still shows */ }
        }
        function fail(reason, force) {
          if (shown || (!force && mounted())) return;
          shown = true;
          record(reason);
          if (force) { var r = document.getElementById('root'); if (r) r.style.display = 'none'; }
          show();
        }
        window.addEventListener('forgenta:boot-failed', function (e) { fail((e && e.detail) || 'chunk', true); });
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'modulepreload'))) fail('script ' + (t.src || t.href || ''), false);
        }, true);
        setTimeout(function () { if (!mounted()) fail('timeout ' + BOOT_TIMEOUT_MS + 'ms', false); }, BOOT_TIMEOUT_MS);
        new MutationObserver(function () {
          var r = document.getElementById('root');
          if (mounted()) hideSplash();
          if (mounted() && r.style.display !== 'none') { var el = document.getElementById('boot-failed'); if (el) el.style.display = 'none'; shown = false; }
        }).observe(document.getElementById('root'), { childList: true });
        document.getElementById('boot-retry').addEventListener('click', function () { location.reload(); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
