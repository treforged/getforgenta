name: "CodeQL (iOS)"

# Default Setup's Swift autobuild failed outright (exit code 1, 0 results - see
# ios-build.yml-shaped diagnosis 2026-06-22). This workflow runs a real, unsigned simulator
# build via the same Node setup + npm build + cap sync steps as ios-build.yml, skipping
# certificate/provisioning-profile import and archive/export/upload (not needed for analysis),
# so CodeQL gets a working build-mode: manual database instead of failing.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LD_CLIENT_ID: ${{ secrets.VITE_LD_CLIENT_ID }}

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for simulator (unsigned - no certs needed for analysis)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
