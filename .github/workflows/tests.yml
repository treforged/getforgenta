name: Tests

# THE POINT OF THIS FILE IS THAT IT DEPLOYS NOTHING.
#
# Until 2026-09-03 the only workflow that touched the Android project was
# `android-build.yml`, which ships to Google Play (production, staged 10%) on
# every push to main touching `src/**` or `android/**`. That made `main` a
# release channel rather than a branch, and it meant THE ONLY WAY TO EXERCISE CI
# WAS TO PUBLISH A RELEASE. A pipeline you cannot test without shipping is a
# pipeline nobody touches — which is how `android/app/src/test` sat for years as
# a directory that had never run, looking exactly like coverage.
#
# So: no deploy step, no signing secrets, no store credentials, and NO PATH
# FILTER. The absent filter is deliberate. A CI change should verify itself on
# its own push, and a filter listing `src/**` and `android/**` is precisely what
# stopped that — a change to a workflow file did not match its own trigger.
#
# This runs on pull_request too, so a failure is visible BEFORE a merge that
# would deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # `vitest run` exits 0 when it matches no test files, so the count is
      # asserted rather than assumed — same reasoning as the Android step below
      # and as `check:debug-console` failing when it finds no bundle. A suite
      # that runs nothing is not a passing suite.
      - name: Unit tests
        # DUMMY VALUES, DELIBERATELY NOT THE REAL SECRETS.
        #
        # `src/integrations/supabase/client.ts` THROWS at import time when these
        # are missing, so seven suites that transitively import it died before a
        # single test ran — and this workflow had never once been green since it
        # was added. Locally the vars come from `.env.local`, which is gitignored
        # and does not exist on a runner, so a suite that passes on this machine
        # says nothing about CI.
        #
        # The guard is CORRECT and is not weakened: shipping a build with no
        # Supabase URL should fail loudly. These are jsdom unit tests that never
        # open a socket, so they need the variables to EXIST, not to be real.
        # Using the actual secrets here would expose live credentials to every
        # test run for no benefit and make the suite depend on a real project.
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_not_a_real_key
        run: |
          set -o pipefail
          # TWO reporters, and NO `| tail`. The first version of this step ran
          # `--reporter=json ... | tail -20`: when a test failed, the JSON went to
          # a file and the human-readable failure went nowhere, so the step said
          # only "exit code 1". A gate that fails without saying why is a gate
          # somebody disables. `default` prints which test failed and how;
          # `json` is what the count below is read from.
          npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json
          TOTAL=$(node -e "const r=require('./vitest-results.json');console.log(r.numTotalTests||0)")
          echo "Web tests executed: $TOTAL"
          echo "Web tests executed: $TOTAL" >> "$GITHUB_STEP_SUMMARY"
          # A FLOOR NEAR THE REAL COUNT, not merely non-zero.
          #
          # `-lt 1` catches "the suite ran nothing". It does NOT catch "half the
          # suites stopped loading", which is the shape this repo actually hit:
          # seven suites died at import on a missing env var. That run exited
          # non-zero for its own reasons, but the same import failure in a suite
          # vitest treats as skippable would sail past a non-zero check with a
          # collapsed count and a green tick.
          #
          # 3404 tests pass as of 2026-09-03. The floor is set well below that so
          # ordinary churn — deleting a test file, moving cases around — does not
          # trip it, while losing whole swathes of the suite does.
          #
          # ⚠️ IT DECAYS UPWARD. As the suite grows, a fixed floor protects a
          # smaller and smaller fraction of it. Raise it when the real count has
          # moved well past it; a floor at a third of the true count is barely a
          # floor at all. That maintenance cost is the price of the check, and it
          # is worth naming rather than discovering.
          MIN_TESTS=3000
          if [ "$TOTAL" -lt "$MIN_TESTS" ]; then
            echo "::error::vitest reported $TOTAL tests, below the floor of $MIN_TESTS. Either whole suites stopped loading, or the floor is stale and should be re-set deliberately — do not lower it to make this pass."
            exit 1
          fi

  android:
    name: Android (JVM unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      # `npx cap sync android` needs the web build output to exist, and the
      # Android project needs the sync to have run. Neither needs secrets: this
      # is an unsigned, un-uploaded build of the test sources only.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Run Android unit tests
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:testDebugUnitTest
          RESULTS=app/build/test-results/testDebugUnitTest
          if [ ! -d "$RESULTS" ]; then
            echo "::error::No test results directory at android/$RESULTS - the task matched nothing."
            exit 1
          fi
          # awk rather than `paste | bc`: bc is not guaranteed on a runner image,
          # and a missing binary would fail this for a reason unrelated to tests.
          TOTAL=$(grep -ho 'tests="[0-9]*"' "$RESULTS"/*.xml | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "Android unit tests executed: $TOTAL"
          echo "Android unit tests executed: $TOTAL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -lt 1 ]; then
            echo "::error::Android unit tests reported $TOTAL executed. A suite that runs nothing is not a passing suite."
            exit 1
          fi

      # Kept even on failure: "which test failed" should not require re-running
      # the job locally, which on this repo is impossible without an SDK.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: android/app/build/test-results/testDebugUnitTest
          retention-days: 14
