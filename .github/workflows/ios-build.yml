name: iOS Build & Upload to App Store

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
  workflow_dispatch:

# ONE STORE DEPLOY AT A TIME.
#
# Google Play's publishing API works through an "Edit" — a transaction opened
# against the app, written to, then committed. Two runs open two edits over the
# same app and the second invalidates the first, which surfaces as:
#
#   ##[error]This edit has expired, please create a new Edit.
#
# That is what failed on 2026-08-11: three pull requests merged within seconds
# of each other, each pushing to main, each starting this workflow. Two runs
# collided and died at the upload step after doing all the work — the build was
# never the problem.
#
# `cancel-in-progress: true` rather than queueing, because these deploy to a
# STORE. If two commits land a minute apart, shipping the older one first is
# pointless work that also publishes a version nobody wants; the newest commit
# on main is the only one worth releasing. Queueing would serialise the edits
# and remove the error, and still push an intermediate build to production.
concurrency:
  group: store-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Matching android-build.yml, for the version staleness notice below. `git log` against
          # the commit that last touched VERSION cannot see past the fetch horizon, and the default
          # depth-1 checkout has no history to count at all, so the notice would have had nothing to
          # say on the very workflow whose upload Apple rejected on 2026-08-21. Nothing else in this
          # job reads history.
          fetch-depth: 50

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LD_CLIENT_ID: ${{ secrets.VITE_LD_CLIENT_ID }}

      # SECURITY GATE, not a lint. Eruda/vConsole expose localStorage, which in
      # this app holds the Supabase auth session JWT - shipping one to production
      # is account takeover, not a debug convenience. The runtime guard in
      # src/lib/debug-console.ts is one careless refactor from being wrong
      # (a top-level import bundles the console regardless of any guard below
      # it), so the guarantee is this build-time failure. It also fails when it
      # finds no bundle to inspect, so a renamed output directory cannot turn it
      # into a green no-op.
      - name: Assert no debug console in the production bundle
        run: npm run check:debug-console

      - name: Sync Capacitor
        run: npx cap sync ios && echo "=== public/ contents ===" && ls ios/App/App/public/ && echo "=== index.html check ===" && head -5 ios/App/App/public/index.html

      - name: Compute version
        run: |
          # versionName comes from the VERSION file now, not from the run
          # number. See scripts/read-version.mjs for why, and note that
          # versionCode is deliberately still run_number + 100 - Play orders
          # builds by it and it must only ever increase.
          node scripts/read-version.mjs >> "$GITHUB_ENV"
          node scripts/read-version.mjs

      # NON-BLOCKING BY CONSTRUCTION, AND IT HAS TO STAY THAT WAY. This prints a reading to the run
      # summary about whether VERSION has moved since the last time it did; it does not gate the
      # deploy. `continue-on-error` is belt and braces on top of the script itself, which exits 0
      # on every path including its own failures. The split is deliberate: an ILLEGAL version is a
      # hard stop in the step above, because a build is the last place to discover a typo, while a
      # STALE version still builds, still installs, and is still the right thing to ship if the
      # person reading the summary decides so. See scripts/version-staleness.mjs.
      #
      # `if: always()` so a build that dies further down still leaves the reading behind. "Why did
      # this ship 6.4 again" is a question asked about failed runs too.
      #
      # `set -o pipefail` because `tee` is the last command in the pipe and its exit status is the
      # step's. Measured on 2026-08-22 against a checkout that made the script throw: the step exit
      # code GitHub saw was 0 and the bytes appended to $GITHUB_STEP_SUMMARY were 0. A notice step
      # that crashes and reports success is strictly worse than no notice step, because the empty
      # summary reads as "nothing to say". With pipefail the crash shows as a red step. It still
      # cannot take the deploy down: `continue-on-error: true` above is what guarantees that, and
      # it is why making this louder is safe.
      - name: Version staleness notice
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/version-staleness.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # THE "WHAT'S NEW" TEXT, FOR A HUMAN TO PASTE.
      #
      # This job cannot set App Store Connect's "What's New" and no step here is
      # trying to. `xcrun altool --upload-app` transmits the BINARY only; the
      # release-notes field belongs to a different API (App Store Connect's
      # appStoreVersionLocalizations), which this workflow holds no client for.
      # Automating it is real work and is deliberately out of scope.
      #
      # What is cheap is not making Tre write the wording twice. Android already
      # generates a customer note from exactly these commits; this prints the same
      # note into the run summary so it can be copied straight into App Store
      # Connect. Same generator, same range logic, so the two stores say the same
      # thing. Write the wording once with a `Release-Note:` trailer and both
      # listings get it. How to write one: docs/release-notes-template.md.
      #
      # Non-blocking by construction, like the staleness notice above it: this is
      # a reading, not a gate, and a store deploy must never fail over one.
      - name: Customer release note (paste into App Store Connect)
        if: always()
        continue-on-error: true
        run: |
          if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-6"
          fi
          NOTE=$(node scripts/release-notes.mjs "$RANGE")
          {
            echo "### What's New — paste into App Store Connect"
            echo ""
            echo '```'
            echo "$NOTE"
            echo '```'
            echo ""
            echo "_Generated by scripts/release-notes.mjs from \`$RANGE\`, the same text Google Play receives._"
            echo "_altool uploads the binary only, so this field still has to be pasted by hand._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set build number and version
        run: |
          cd ios/App
          xcrun agvtool new-version -all ${{ env.VERSION_CODE }}
          xcrun agvtool new-marketing-version ${{ env.VERSION_NAME }}

      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Import provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH/forged.mobileprovision"

      # ⚠️ SAY WHAT THE PROFILE ACTUALLY CARRIES, because a green signing run does not prove it.
      #
      # `signingStyle: manual` does NOT reliably fail when the profile lacks a capability — Xcode
      # can silently DROP the entitlement from the exported binary instead. That produces a build
      # which signs cleanly, ships, installs, calls `register()` and never hears back: exactly the
      # 22 `timeout` registrations measured on a real iPhone on 2026-09-05, over a full hour, with
      # permission already granted.
      #
      # We took a green run as proof the profile carried push. It only ever proved the profile and
      # the certificate matched each other. So the profile now states its own capabilities in the
      # log, and a missing `aps-environment` FAILS HERE — loudly, before a build nobody can receive
      # notifications on reaches TestFlight.
      #
      # Only the entitlement KEYS are printed. The profile also contains certificates and a team
      # identifier, and none of that belongs in a public run log.
      - name: Assert the provisioning profile carries push
        run: |
          set -o pipefail
          PROFILE=~/Library/MobileDevice/Provisioning\ Profiles/forged.mobileprovision
          ENTITLEMENTS=$(security cms -D -i "$PROFILE"             | plutil -extract Entitlements xml1 -o - -             | plutil -p - || true)
          echo "Profile entitlement keys:"
          echo "$ENTITLEMENTS" | grep -oE '"[a-z0-9.\-]+" =>' | sort -u || true
          if ! echo "$ENTITLEMENTS" | grep -q "aps-environment"; then
            echo "::error::The provisioning profile has NO aps-environment. Push Notifications is           not enabled on this profile, so the entitlement will be dropped from the IPA and every           registration will time out. Regenerate the profile with the capability enabled and           re-encode BUILD_PROVISION_PROFILE_BASE64."
            exit 1
          fi
          echo "aps-environment present in the profile: $(echo "$ENTITLEMENTS" | grep -A1 'aps-environment' | tail -1)"

      - name: Build IPA
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Forged.xcarchive \
            archive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.treforged.forged</key>
              <string>Forged App Store</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Forged.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      # ⚠️ READ THE ENTITLEMENTS OUT OF THE BINARY THAT ACTUALLY SHIPS.
      #
      # This is the LAST unverified link in the push chain, and every earlier check verified an
      # INPUT rather than the artifact:
      #   • `App.entitlements` says `aps-environment: production` — that is the SOURCE.
      #   • The profile decode step proves the profile carries `aps-environment` — that is the
      #     PROFILE.
      # Neither proves the exported `.app` contains it. With `signingStyle: manual`, Xcode can DROP
      # an entitlement at export without failing the build, and a binary with no `aps-environment`
      # is exactly a device that calls `register()`, gets no token AND NO ERROR, and times out.
      #
      # That is the measured signature: 36 attempts on a real iPhone across builds 676, 682, 684
      # and 686, every one `timeout`, `prompted: false`, and — once the error text was finally
      # captured — `detail: NULL`, meaning `registrationError` never fired at all. iOS is not
      # refusing; it has nothing to say. Three correct fixes (missing entitlement, `development`
      # instead of `production`, and a listener race) each changed nothing.
      #
      # `codesign -d --entitlements` reads the signed artifact itself, so this either finds the bug
      # or permanently retires the last guess. It FAILS the run rather than printing a warning,
      # because a build nobody can receive a notification on should not reach TestFlight quietly.
      - name: Assert the exported binary carries aps-environment
        run: |
          set -o pipefail
          APP=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .ipa found under $RUNNER_TEMP/ipa"; exit 1; fi
          WORK="$RUNNER_TEMP/ipa-inspect"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$APP" -d "$WORK"
          BUNDLE=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$BUNDLE" ]; then echo "::error::No .app inside the IPA payload"; exit 1; fi

          ENT=$(codesign -d --entitlements :- --xml "$BUNDLE" 2>/dev/null | plutil -p - || true)
          # KEYS AND VALUES. None of these is a secret — the team identifier already appears in the
          # profile step's output — and the VALUES are the point: a key list cannot tell a
          # distribution build from a development one.
          echo "Entitlements in the SHIPPED binary:"
          echo "$ENT"

          # ⚠️ `get-task-allow` MUST BE FALSE ON A DISTRIBUTION BUILD. True means the binary is
          # DEVELOPMENT-signed and debuggable, and a development-signed binary claiming
          # `aps-environment: production` is a mismatch APNs resolves by saying nothing — which is
          # the symptom being chased. Reported rather than asserted for now: it has never been
          # measured here, and failing a build on an untested assumption is how this day started.
          echo "get-task-allow: $(echo "$ENT" | grep -A0 '"get-task-allow"' | head -1)"

          APS=$(echo "$ENT" | grep -A0 '"aps-environment"' | head -1)
          if [ -z "$APS" ]; then
            echo "::error::The exported binary has NO aps-environment. The source and the profile \
          both have it, so Xcode dropped it at export. Push registration will time out on every \
          device with no error, which is exactly the symptom being chased."
            exit 1
          fi
          echo "aps-environment in the shipped binary: $APS"
          if ! echo "$APS" | grep -q "production"; then
            echo "::error::The exported binary has aps-environment but NOT production. A TestFlight \
          build is distribution-signed and registers against production APNs; a sandbox value \
          makes register() hang with no error."
            exit 1
          fi

      # ⛔ UPLOADING IS DELIBERATE NOW, NOT AUTOMATIC (2026-09-03).
      #
      # This step ran on EVERY push to main touching src/**, and on 2026-09-03 it
      # sent ELEVEN builds to TestFlight in one day — test fixes, a date sweep, a
      # settings toggle, a demo fixture — until Apple refused the twelfth:
      #
      #   ERROR: [altool] Upload limit reached ... (90382)
      #
      # None of those eleven was a release. The limit was the symptom, not the
      # problem. Building on every push is worth keeping — it catches an iOS
      # compile break the moment it lands — but SHIPPING on every push spends a
      # daily quota on commits nobody meant to release, and puts a red build
      # email in Tre's inbox for something that needs no action.
      #
      # So the build still runs on every qualifying push; the upload does not.
      # Ship on purpose: `workflow_dispatch`, or a `v*` tag.
      - name: Upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          # TELL A RATE LIMIT APART FROM A BROKEN BUILD. A bare red for 90382
          # says "wait a day" in the same voice as "your code does not compile",
          # and a red that cannot distinguish those teaches everyone to ignore
          # reds. That is the cry-wolf failure, arriving in Tre's inbox.
          if xcrun altool --upload-app \
               -f $RUNNER_TEMP/ipa/App.ipa \
               --type ios \
               --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
               --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"; then
            echo "Uploaded to App Store Connect."
          elif grep -q '90382' "$RUNNER_TEMP/altool.log"; then
            echo "::warning::Apple upload limit reached (90382). The build is fine — nothing to fix. Retry tomorrow."
            {
              echo "### Apple upload limit reached — NO ACTION NEEDED"
              echo "The app built and signed correctly. Apple caps uploads per app per day; retry tomorrow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::altool upload failed for a reason OTHER than the daily limit — read the log above."
            exit 1
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
