name: Android Build & Upload to Play Store

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
  workflow_dispatch:

# ONE STORE DEPLOY AT A TIME.
#
# Google Play's publishing API works through an "Edit" — a transaction opened
# against the app, written to, then committed. Two runs open two edits over the
# same app and the second invalidates the first, which surfaces as:
#
#   ##[error]This edit has expired, please create a new Edit.
#
# That is what failed on 2026-08-11: three pull requests merged within seconds
# of each other, each pushing to main, each starting this workflow. Two runs
# collided and died at the upload step after doing all the work — the build was
# never the problem.
#
# `cancel-in-progress: true` rather than queueing, because these deploy to a
# STORE. If two commits land a minute apart, shipping the older one first is
# pointless work that also publishes a version nobody wants; the newest commit
# on main is the only one worth releasing. Queueing would serialise the edits
# and remove the error, and still push an intermediate build to production.
concurrency:
  group: store-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Default shallow (depth 1) checkout wouldn't contain github.event.before, so the
          # release-notes step below could never resolve "commits in this push" and would always
          # fall back to "last 6 commits by HEAD" instead. 50 comfortably covers any normal push.
          fetch-depth: 50

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/forged.jks

      - name: Compute version
        run: |
          BASE_RUN=4
          DELTA=$(( ${{ github.run_number }} - BASE_RUN ))
          RAW=$(( 75 + DELTA ))
          MAJOR=$(( 1 + RAW / 100 ))
          MINOR=$(( RAW % 100 ))
          VERSION_NAME="${MAJOR}.$(printf '%02d' $MINOR)"
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "  → versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"

      - name: Build release AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName="${{ env.VERSION_NAME }}" \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/forged.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: forged-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload mapping (deobfuscation) file
        uses: actions/upload-artifact@v7
        with:
          name: forged-release-mapping.txt
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Generate release notes from this push's commits
        run: |
          mkdir -p whatsnew
          if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-6"
          fi
          # Filtering, sentence-casing, dedup, the 500-char Play limit and
          # word-boundary truncation all live in the script so they can be
          # tested locally. See scripts/release-notes.sh.
          bash scripts/release-notes.sh "$RANGE" > whatsnew/whatsnew-en-US
          echo "--- Generated whatsnew-en-US ($(wc -c < whatsnew/whatsnew-en-US) chars) ---"
          cat whatsnew/whatsnew-en-US
          # Hard stop rather than let Play reject the upload or publish a stub.
          CHARS=$(wc -c < whatsnew/whatsnew-en-US)
          if [ "$CHARS" -gt 500 ] || [ "$CHARS" -lt 20 ]; then
            echo "::error::whatsnew-en-US is $CHARS chars; must be 20-500."
            exit 1
          fi

      - name: Deploy to Google Play (Production, staged 10%)
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: com.treforged.forged
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: inProgress
          userFraction: 0.10
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: whatsnew
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
