name: Android Build & Upload to Play Store

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
  workflow_dispatch:

# ONE STORE DEPLOY AT A TIME.
#
# Google Play's publishing API works through an "Edit" — a transaction opened
# against the app, written to, then committed. Two runs open two edits over the
# same app and the second invalidates the first, which surfaces as:
#
#   ##[error]This edit has expired, please create a new Edit.
#
# That is what failed on 2026-08-11: three pull requests merged within seconds
# of each other, each pushing to main, each starting this workflow. Two runs
# collided and died at the upload step after doing all the work — the build was
# never the problem.
#
# `cancel-in-progress: true` rather than queueing, because these deploy to a
# STORE. If two commits land a minute apart, shipping the older one first is
# pointless work that also publishes a version nobody wants; the newest commit
# on main is the only one worth releasing. Queueing would serialise the edits
# and remove the error, and still push an intermediate build to production.
concurrency:
  group: store-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Default shallow (depth 1) checkout wouldn't contain github.event.before, so the
          # release-notes step below could never resolve "commits in this push" and would always
          # fall back to "last 6 commits by HEAD" instead. 50 comfortably covers any normal push.
          #
          # The version staleness notice reads this same history, and it needs the commit that last
          # touched VERSION to be inside it. On 2026-08-21 that gap was 72 commits, past this
          # horizon, so the notice is written to report a FLOOR when it cannot see the anchor rather
          # than print a smaller number confidently. Depth stays at 50: a store deploy should not
          # pay for a full 121 MB history clone to sharpen an advisory count.
          fetch-depth: 50

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # SECURITY GATE, not a lint. Eruda/vConsole expose localStorage, which in
      # this app holds the Supabase auth session JWT - shipping one to production
      # is account takeover, not a debug convenience. The runtime guard in
      # src/lib/debug-console.ts is one careless refactor from being wrong
      # (a top-level import bundles the console regardless of any guard below
      # it), so the guarantee is this build-time failure. It also fails when it
      # finds no bundle to inspect, so a renamed output directory cannot turn it
      # into a green no-op.
      - name: Assert no debug console in the production bundle
        run: npm run check:debug-console

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # THE ANDROID UNIT TESTS HAD NEVER RUN IN CI. This workflow went straight from
      # `chmod +x gradlew` to `bundleRelease`, and `bundleRelease` does not run
      # tests — so every release to date shipped without them, while
      # `android/app/src/test` sat there looking like coverage. That is the same
      # failure as a backup reporting success for six days: the appearance of a
      # check is worse than its absence, because it stops anyone looking.
      #
      # BEFORE the build, not after, so a failing test stops a release rather
      # than being reported about one that already exists. No `continue-on-error`:
      # a test step that runs and is ignored manufactures exactly the false
      # confidence it was added to remove.
      #
      # AND IT FAILS WHEN IT MATCHES NOTHING. A gradle task that silently found
      # no tests would go green and prove nothing — the same hole one level up —
      # so the count is read out of the JUnit XML and asserted non-zero, the way
      # `check:debug-console` fails when it finds no bundle to inspect.
      - name: Run Android unit tests
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:testDebugUnitTest
          RESULTS=app/build/test-results/testDebugUnitTest
          if [ ! -d "$RESULTS" ]; then
            echo "::error::No test results directory at android/$RESULTS - the task matched nothing."
            exit 1
          fi
          # awk rather than `paste | bc`: bc is not guaranteed on a runner image, and
          # a missing binary here would fail the step for a reason that has nothing
          # to do with the tests.
          TOTAL=$(grep -ho 'tests="[0-9]*"' "$RESULTS"/*.xml | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "Android unit tests executed: ${TOTAL:-0}"
          if [ -z "$TOTAL" ] || [ "$TOTAL" -lt 1 ]; then
            echo "::error::Android unit tests reported $TOTAL executed. A suite that runs nothing is not a passing suite."
            exit 1
          fi
          echo "Android unit tests executed: $TOTAL" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/forged.jks

      - name: Compute version
        run: |
          # versionName comes from the VERSION file now, not from the run
          # number. See scripts/read-version.mjs for why, and note that
          # versionCode is deliberately still run_number + 100 - Play orders
          # builds by it and it must only ever increase.
          node scripts/read-version.mjs >> "$GITHUB_ENV"
          node scripts/read-version.mjs

      # NON-BLOCKING BY CONSTRUCTION, AND IT HAS TO STAY THAT WAY. This prints a reading to the run
      # summary about whether VERSION has moved since the last time it did; it does not gate the
      # deploy. `continue-on-error` is belt and braces on top of the script itself, which exits 0
      # on every path including its own failures. The split is deliberate: an ILLEGAL version is a
      # hard stop in the step above, because a build is the last place to discover a typo, while a
      # STALE version still builds, still installs, and is still the right thing to ship if the
      # person reading the summary decides so. See scripts/version-staleness.mjs.
      #
      # `if: always()` so a build that dies further down still leaves the reading behind. "Why did
      # this ship 6.4 again" is a question asked about failed runs too.
      #
      # `set -o pipefail` because `tee` is the last command in the pipe and its exit status is the
      # step's. Measured on 2026-08-22 against a checkout that made the script throw: the step exit
      # code GitHub saw was 0 and the bytes appended to $GITHUB_STEP_SUMMARY were 0. A notice step
      # that crashes and reports success is strictly worse than no notice step, because the empty
      # summary reads as "nothing to say". With pipefail the crash shows as a red step. It still
      # cannot take the deploy down: `continue-on-error: true` above is what guarantees that, and
      # it is why making this louder is safe.
      - name: Version staleness notice
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/version-staleness.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build release AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName="${{ env.VERSION_NAME }}" \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/forged.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: forged-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload mapping (deobfuscation) file
        uses: actions/upload-artifact@v7
        with:
          name: forged-release-mapping.txt
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Generate release notes from this push's commits
        run: |
          mkdir -p whatsnew
          if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-6"
          fi
          # HOW TO WRITE THE WORDING THAT LANDS HERE: docs/release-notes-template.md.
          #
          # The generator moved from bash to node on 2026-08-22 so it could be
          # TESTED. See scripts/lib/__tests__/release-notes.test.mjs, which pins
          # the output for the three releases that really shipped. The output
          # contract is unchanged: notes on stdout, exit 0, and 20..480 bytes,
          # which is the GENERATOR's own cap sitting inside the 20..500 the check
          # below enforces (500 is Play's per-locale limit). Two numbers, and
          # they are not the same number.
          #
          # What changed is what it PUBLISHES. It no longer echoes commit
          # subjects at all. It prefers a `Release-Note:` trailer written by a
          # person, falls back to pre-written themed sentences, and says
          # "maintenance release" when nothing user-visible shipped.
          #
          # --why and any warnings go to stderr, so they land in the log without
          # touching the file. A warning here means somebody wrapped a
          # `Release-Note:` trailer onto a second line and lost half of it.
          node scripts/release-notes.mjs "$RANGE" --why > whatsnew/whatsnew-en-US
          echo "--- Generated whatsnew-en-US ($(wc -c < whatsnew/whatsnew-en-US) chars) ---"
          cat whatsnew/whatsnew-en-US
          # Hard stop rather than let Play reject the upload or publish a stub.
          CHARS=$(wc -c < whatsnew/whatsnew-en-US)
          if [ "$CHARS" -gt 500 ] || [ "$CHARS" -lt 20 ]; then
            echo "::error::whatsnew-en-US is $CHARS chars; must be 20-500."
            exit 1
          fi

      - name: Deploy to Google Play (Production, staged 10%)
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: com.treforged.forged
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: inProgress
          userFraction: 0.10
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: whatsnew
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
