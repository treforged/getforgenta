# iOS simulator screenshots (ask ef0dc559).
#
# DISPATCH-ONLY ON PURPOSE: a push to main cancels in-flight iOS runs, so this never
# runs on push. Run it with:  gh workflow run "iOS Simulator Screenshots" --ref main
#
# WHAT A PASS MEANS, AND WHAT IT DOES NOT:
#   - the app builds for the simulator, installs, launches, and is STILL RUNNING 20 s later
#     (the Xcode 27 UIScene crash killed the app ~0.4 s after launch, so "launched" alone
#     would pass a crashing app);
#   - a screenshot of the simulator screen is uploaded as the `ios-sim-screenshots` artifact.
# It is a SIMULATOR frame, not a device, not TestFlight, and NOT a home screen - simctl
# cannot place a widget on a home screen. Widget, native glass and share-sheet shots are
# later steps in this same job (see handoff.md R1).

name: iOS Simulator Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LD_CLIENT_ID: ${{ secrets.VITE_LD_CLIENT_ID }}

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot a simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          # Prints "UDID<TAB>name<TAB>runtime" for the first available iPhone, or nothing.
          PICK=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(f'{d["udid"]}\t{d["name"]}\t{runtime}')
                      sys.exit(0)
          PY
          )
          if [ -z "$PICK" ]; then
            echo "NO AVAILABLE iPhone SIMULATOR on this runner"
            exit 2
          fi
          UDID=$(printf '%s' "$PICK" | cut -f1)
          echo "Simulator: $(printf '%s' "$PICK" | cut -f2) / $(printf '%s' "$PICK" | cut -f3) / $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install and launch
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DD/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP" ]; then
            echo "BUILT APP MISSING: $APP"
            exit 2
          fi
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.treforged.forged
          sleep 20

      - name: Assert the app is still running
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl spawn "$UDID" launchctl list > "$RUNNER_TEMP/launchctl.txt"
          # Positive control: the list must hold SOMETHING, or an empty read would look like a crash.
          LINES=$(wc -l < "$RUNNER_TEMP/launchctl.txt")
          if [ "$LINES" -lt 10 ]; then
            echo "CONTROL FAILED: launchctl list returned $LINES lines, cannot judge"
            exit 2
          fi
          if ! grep -q "com.treforged.forged" "$RUNNER_TEMP/launchctl.txt"; then
            echo "APP NOT RUNNING 20 s after launch - it crashed ($LINES services listed)"
            exit 1
          fi
          echo "App is running ($LINES services listed)"

      - name: Screenshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/01-launch.png
          python3 - shots/01-launch.png <<'PY'
          import os, sys
          size = os.path.getsize(sys.argv[1])
          print(f"{sys.argv[1]}: {size} bytes")
          if size < 20000:
              print("SCREENSHOT TOO SMALL, likely a blank frame")
              sys.exit(1)
          PY

      # Item 2: the widget. A HOST RENDER, not a home screen - see HostRender/WidgetHostRender.swift.
      - name: Build the widget host render
        shell: bash
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/WidgetHost.app"
          mkdir -p "$H"
          xcrun swiftc -parse-as-library \
            -target "$(uname -m)-apple-ios17.0-simulator" \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            ios/App/ForgentaWidget/ForgentaWidgetView.swift \
            ios/App/ForgentaWidget/HostRender/WidgetHostRender.swift \
            -o "$H/WidgetHost"
          python3 - "$H/Info.plist" <<'PY'
          import plistlib, sys
          plistlib.dump({
              "CFBundleIdentifier": "com.treforged.widgethost",
              "CFBundleExecutable": "WidgetHost",
              "CFBundleName": "WidgetHost",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "1",
              "CFBundleSupportedPlatforms": ["iPhoneSimulator"],
              "MinimumOSVersion": "17.0",
              "UIDeviceFamily": [1],
              "UILaunchScreen": {},
          }, open(sys.argv[1], "wb"))
          PY
          codesign --force --sign - "$H"
          xcrun simctl install "$UDID" "$H"

      - name: Screenshot the widget host render (dark and light)
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(xcrun simctl get_app_container "$UDID" com.treforged.widgethost data)
          for P in dark light; do
            rm -f "$DATA/Documents/host-status.txt"
            xcrun simctl terminate "$UDID" com.treforged.widgethost 2>/dev/null || true
            xcrun simctl launch "$UDID" com.treforged.widgethost -palette "$P"
            sleep 8
            if [ ! -f "$DATA/Documents/host-status.txt" ]; then
              echo "HOST WROTE NO STATUS for $P - it did not start, or crashed"
              exit 1
            fi
            STATUS=$(cat "$DATA/Documents/host-status.txt")
            echo "host status: $STATUS"
            # The fixture carries 2 debt rows; anything else means the real decoder refused or dropped them.
            if [ "$STATUS" != "palette=$P decode=ok debts=2" ]; then
              echo "WIDGET FIXTURE NOT DECODED AS EXPECTED for $P"
              exit 1
            fi
            xcrun simctl io "$UDID" screenshot "shots/02-widget-host-$P.png"
            ls -l "shots/02-widget-host-$P.png"
          done

      - name: Crash logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p shots
          cp ~/Library/Logs/DiagnosticReports/App* shots/ 2>/dev/null || echo "no App crash reports"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-screenshots
          path: shots/
          if-no-files-found: warn
