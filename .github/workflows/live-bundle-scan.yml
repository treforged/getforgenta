name: Scan the bundle that actually ships

# ⚠️ WHY THIS EXISTS, AND WHY THE OTHER SCAN IS NOT A SUBSTITUTE.
#
# `capacitor.config.ts` sets `server.url = https://getforgenta.com`, so the native app
# loads the HOSTED site. The `dist/` that ios-build.yml and android-build.yml scan is
# NEVER EXECUTED ON A DEVICE — it is a cheap pre-ship check on an artefact nobody runs.
# Until 2026-09-12 nothing scanned the bundle customers actually execute. This does.
#
# TRIGGER: Vercel posts a `deployment_status` to this repo when a deploy finishes, so
# this needs no deploy credential and no Vercel setting. It runs only on a SUCCESSFUL
# Production deployment.
#
# ⚠️ IT SCANS THE CANONICAL ORIGIN, NOT `environment_url`. The per-deploy
# `*.vercel.app` URL sits behind deployment protection and answers 302 to an
# unauthenticated fetch (measured 2026-09-12) — a scan of that is a scan of a redirect.
# getforgenta.com is public, is what the app loads, and is what the alias points at once
# the deployment reports success.
#
# The scan is read-only: it fetches public URLs and holds no credential of any kind.

# ⛔ THE AUTOMATIC TRIGGERS ARE OFF, AND THIS IS NOT THE GATE BEING WEAKENED.
#
# MEASURED 2026-09-12, run 34671555484: from a GitHub Actions runner this returns
#   [leaked-keys] could not fetch https://getforgenta.com/ — 403 Forbidden
# and exits 2. From this repo's own machine the same command returns 200 and exit 0
# with ANY user agent, including a bare `node` fetch — so it is the IP, not the client.
# Cloudflare sits in front of Vercel and refuses datacenter ranges. (Vercel's own
# `ssoProtection` is `all_except_custom_domains`, so it is NOT the cause here: it is
# why the per-deploy `*.vercel.app` URL 302s, which is a separate reason not to scan
# that URL.)
#
# So on `deployment_status` this workflow could only ever be RED, on every deploy,
# forever — and a check that is always red is a check people stop reading. It is left
# dispatchable so the code stays exercised and so it goes live the moment the network
# path exists.
#
# ⚠️ DO NOT "FIX" THIS BY TREATING A 403 AS A WARNING, A SKIP, OR A PASS. That is the
# obvious-looking change and it is the wrong one. This scan is the ONLY thing that
# looks at the bundle customers execute; a 403 that passes restores exactly the false
# coverage this workflow was written to remove — a green tick standing for a scan that
# never happened. Unreachable is COULD NOT LOOK, and could-not-look is never a pass.
#
# TO RE-ENABLE: a Cloudflare WAF allowance for GitHub Actions IP ranges. That widens
# who can reach the origin, so it is Tre's decision, not a desk's — tracked as ask
# `dea20ff6`. Once it exists, uncomment the two triggers below and delete this block.
#
#   deployment_status:          # Vercel posts this; no credential needed
#   schedule:
#     - cron: '17 9 * * *'      # catches a deploy this workflow never saw
#
# Until then the honest ways to run it are `npm run check:leaked-keys:live` from a
# machine Cloudflare does not block, or a manual dispatch here to prove the code path.

on:
  workflow_dispatch:

concurrency:
  group: live-bundle-scan
  cancel-in-progress: true

jobs:
  scan:
    # Kept for the day `deployment_status` is re-enabled: it fires for every state, and
    # only a successful Production deploy is worth scanning. A manual dispatch carries
    # no deployment context, so it passes this condition.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the scanner is stdlib-only on purpose, so this job cannot be
      # broken by a dependency and takes seconds.
      - name: Scan the live bundle for a non-publishable credential
        run: npm run check:leaked-keys:live
